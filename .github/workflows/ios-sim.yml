# MYSTERY ROOM — iOS Simulator smoke test (Metal), manual trigger only, no signing, no secrets, no upload.
# The container's QA renders with software Vulkan and cannot see Metal-only failures (the owner's iPhone crashed
# on New Game while every container playthrough passed). This builds the same Xcode project for the iOS
# Simulator on a macOS runner, launches it with MR_QA=newgame (game/src/ui/boot.gd plays main menu → New Game
# by itself in tester builds) and reports whether Chapter 1 reached its first drawn seconds. On a crash it prints
# the crash report's exception and crashed thread, and uploads the console, godot.log and the .ips files.
#
# Finding (run 38030309035, 2026-10-10): on GitHub's Apple Silicon VMs the Simulator offers Godot no usable
# Metal device. The game falls back to OpenGL ES (Compatibility, "Apple Software Renderer") and draws about one
# frame in six seconds. So this run CANNOT reproduce Metal-only bugs. It does show that the app links,
# installs, boots to the menu and logs, and it catches script errors on iOS. Use it as a smoke test only.
name: iOS Simulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  BUNDLE_ID: com.mysteryroom.forgotteninstitute

jobs:
  xcode-project:
    name: Xcode project (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot + iOS template
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-ios-linux

      - name: Install Godot and the iOS template
        run: |
          mkdir -p ~/godot
          if [ ! -x ~/godot/godot ]; then
            curl -sSL -o /tmp/g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/g.zip -d ~/godot && mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/ios.zip" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -j /tmp/t.tpz templates/ios.zip templates/version.txt -d "$T"
          fi
          sudo ln -sf ~/godot/godot /usr/local/bin/godot

      - name: "Export the Xcode project (tester build; placeholder team, the simulator needs no signing)"
        run: |
          set -euo pipefail
          godot --headless --path game --import > "$RUNNER_TEMP/import.log" 2>&1 || true
          cd game
          sed -i 's/^application\/app_store_team_id=.*/application\/app_store_team_id="AAAAAAAAAA"/' export_presets.cfg
          sed -i "s/^application\/export_project_only=.*/application\/export_project_only=true/" export_presets.cfg
          awk '/^\[preset\.[0-9]+\]$/ {ios=0} /^name="iOS"$/ {ios=1}
            ios && /^custom_features=/ {print "custom_features=\"beta_unlock\""; next} {print}' export_presets.cfg > "$RUNNER_TEMP/p.cfg"
          mv "$RUNNER_TEMP/p.cfg" export_presets.cfg
          mkdir -p ../build/ios
          godot --headless --export-release "iOS" ../build/ios/MysteryRoom.ipa > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -E "ERROR|WARNING" "$RUNNER_TEMP/export.log" | tail -40; exit 1; }
          ls ../build/ios

      - name: Pack the Xcode project
        run: tar -cf "$RUNNER_TEMP/ios-sim-project.tar" -C build ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-sim-project
          path: ${{ runner.temp }}/ios-sim-project.tar
          retention-days: 1

  simulator:
    name: Build for the Simulator and play New Game (macOS)
    needs: xcode-project
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/ios

      - uses: actions/download-artifact@v4
        with:
          name: ios-sim-project
          path: ${{ runner.temp }}

      - name: Unpack the Xcode project
        run: mkdir -p build && tar -xf "$RUNNER_TEMP/ios-sim-project.tar" -C build && ls build/ios

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta \
            | python3 -c 'import re,sys; l=[x.strip() for x in sys.stdin if x.strip()]; print(max(l, key=lambda p: [int(n) for n in re.findall(r"\d+", p)]) if l else "")')
          [ -n "$XC" ] || { echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      # Godot 4.7.2's simulator library holds x86_64 objects only (every member of libgodot.a in the
      # ios-arm64_x86_64-simulator slice is *.x86_64.simulator.o), so the app is built for x86_64 and the
      # Apple Silicon runner runs it under Rosetta. Rosetta translates the CPU code; drawing still uses Metal.
      - name: Rosetta
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Build for the iOS Simulator (unsigned, x86_64)
        run: |
          xcodebuild build -project build/ios/MysteryRoom.xcodeproj -scheme MysteryRoom -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=x86_64 EXCLUDED_ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -40; tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/build.log"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "MysteryRoom.app" | head -1)
          test -n "$APP" && echo "APP=$APP" >> "$GITHUB_ENV" && echo "built $APP"

      - name: Boot a simulator, install, play New Game
        id: play
        run: |
          set -u
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]; print(sorted(r, key=lambda x: [int(n) for n in x["version"].split(".")])[-1]["identifier"])')
          DT=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone 1") and "Pro" in x["name"] and "Max" not in x["name"]]; print(sorted(d)[-1])')
          echo "runtime $RT, device $DT"
          UDID=$(xcrun simctl create mr-qa "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$RUNNER_TEMP/out"
          # SIMCTL_CHILD_* variables reach the app's environment; the game quits by itself when done, and a
          # watchdog ends a hung run after 4 minutes (macOS has no `timeout`)
          ( sleep 240; xcrun simctl terminate "$UDID" "$BUNDLE_ID" ) > /dev/null 2>&1 &
          WD=$!
          SIMCTL_CHILD_MR_QA=newgame xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BUNDLE_ID" \
            > "$RUNNER_TEMP/out/console.txt" 2>&1
          echo "launch exit $?"
          kill "$WD" 2>/dev/null || true
          sleep 5 # let the crash reporter write its .ips
          grep -E "QA_NEWGAME|SCRIPT ERROR|ERROR:" "$RUNNER_TEMP/out/console.txt" | tail -40 || true
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
          [ -n "$DATA" ] && find "$DATA" -name "godot*.log" -exec cp {} "$RUNNER_TEMP/out/" \; || true
          [ -n "$DATA" ] && find "$DATA" -name "session_stage.txt" -exec cat {} \; || true
          cp ~/Library/Logs/DiagnosticReports/MysteryRoom*.ips "$RUNNER_TEMP/out/" 2>/dev/null || true
          if grep -q "QA_NEWGAME_OK" "$RUNNER_TEMP/out/console.txt"; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "## Simulator: New Game reached Chapter 1 (QA_NEWGAME_OK)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "## Simulator: New Game did NOT reach Chapter 1" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Crash reports (exception and crashed thread)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/out/*.ips; do
            echo "== $(basename "$f")"
            python3 -c 'import sys; sys.path.insert(0, "tools/ios"); from asc_check import crash_summary; print("\n".join(crash_summary(open(sys.argv[1]).read())))' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          for f in "$RUNNER_TEMP"/out/godot*.log; do
            echo "== $(basename "$f") (errors and the last lines)"
            grep -nE "ERROR|SCRIPT ERROR|WARNING" "$f" | tail -40 || true
            tail -30 "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-logs
          path: ${{ runner.temp }}/out
          retention-days: 7

      - name: Result
        run: '[ "${{ steps.play.outputs.result }}" = "ok" ] || { echo "::error::New Game did not reach Chapter 1 on the iOS Simulator"; exit 1; }'
