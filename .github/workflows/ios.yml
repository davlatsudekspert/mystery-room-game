# MYSTERY ROOM — iOS build on macOS + optional TestFlight upload.
# Manual trigger only. macOS runner minutes count 10x against the private-repo quota: run only with owner consent.
# Required secrets (never commit them):
#   IOS_TEAM_ID                     Apple Developer Team ID
#   IOS_DIST_CERT_P12_BASE64        Apple Distribution certificate (.p12), base64
#   IOS_DIST_CERT_PASSWORD          password of the .p12
#   IOS_PROVISION_PROFILE_BASE64    App Store provisioning profile for com.mysteryroom.forgotteninstitute, base64
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64   App Store Connect API key (for TestFlight upload)
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed IPA to TestFlight"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.7.2"
  BUNDLE_ID: com.mysteryroom.forgotteninstitute

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot (macOS) and iOS templates
        run: |
          curl -sSL -o /tmp/g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/g.zip -d /tmp/godot
          echo "GODOT=/tmp/godot/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          curl -sSL -o /tmp/t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/t.tpz templates/ios.zip templates/version.txt -d "$T"

      - name: Import signing assets into a temporary keychain
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12" ] || [ -z "$PROFILE" ]; then
            echo "SIGNING=none" >> $GITHUB_ENV
            echo "::warning::No signing secrets: exporting an unsigned Xcode project only."
            exit 0
          fi
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/mysteryroom.mobileprovision
          echo "SIGNING=ok" >> $GITHUB_ENV

      - name: Export iOS
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd game
          "$GODOT" --headless --import || true
          mkdir -p ../build/ios
          if [ "$SIGNING" = "ok" ]; then
            sed -i '' "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$TEAM_ID\"/" export_presets.cfg
            "$GODOT" --headless --export-release "iOS" ../build/ios/MysteryRoom.ipa
          else
            sed -i '' "s/^application\/export_project_only=.*/application\/export_project_only=true/" export_presets.cfg
            "$GODOT" --headless --export-release "iOS" ../build/ios/MysteryRoom.xcodeproj || true
          fi
          ls -la ../build/ios

      - uses: actions/upload-artifact@v4
        with:
          name: mystery-room-ios
          path: build/ios/
          retention-days: 7

      - name: Upload to TestFlight
        if: inputs.upload_to_testflight && env.SIGNING == 'ok'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/MysteryRoom.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
