# MYSTERY ROOM — iOS build on macOS with Xcode cloud signing + TestFlight upload.
# Manual trigger only (macOS minutes count 10x against the free private-repo quota).
#
# Owner setup (one time, no Mac needed):
#   1. App Store Connect → Users and Access → Integrations → App Store Connect API → "+"
#      Role: Admin (needed for cloud-managed distribution certificates). Download the .p8 once.
#   2. Repository secrets:
#        IOS_TEAM_ID         (developer.apple.com → Membership → Team ID)
#        ASC_KEY_ID          (Key ID of the API key)
#        ASC_ISSUER_ID       (Issuer ID shown above the keys list)
#        ASC_KEY_P8_BASE64   (base64 of the downloaded AuthKey_XXXX.p8)
#   3. App Store Connect → Apps → "+" New App with bundle id com.mysteryroom.forgotteninstitute
#      (register the bundle id under developer.apple.com → Identifiers first if it is not listed).
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the build to TestFlight"
        type: boolean
        default: true

env:
  GODOT_VERSION: "4.7.2"
  BUNDLE_ID: com.mysteryroom.forgotteninstitute

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then
            echo "::error::Missing IOS_TEAM_ID / ASC_* secrets — see the header of this workflow."
            exit 1
          fi

      - name: Install Godot (macOS) and iOS templates
        run: |
          curl -sSL -o /tmp/g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/g.zip -d /tmp/godot
          echo "GODOT=/tmp/godot/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          curl -sSL -o /tmp/t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/t.tpz templates/ios.zip templates/version.txt -d "$T"

      - name: App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Export Xcode project from Godot
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd game
          sed -i '' "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$TEAM_ID\"/" export_presets.cfg
          sed -i '' "s/^application\/export_project_only=.*/application\/export_project_only=true/" export_presets.cfg
          sed -i '' "s/^application\/version=.*/application\/version=\"${{ github.run_number }}\"/" export_presets.cfg
          "$GODOT" --headless --import || true
          mkdir -p ../build/ios
          # the .ipa path names the project (build/ios/MysteryRoom.xcodeproj); with export_project_only
          # Godot writes the Xcode project only (verified on Linux: scheme "MysteryRoom", team + bundle id set)
          "$GODOT" --headless --export-release "iOS" ../build/ios/MysteryRoom.ipa
          ls -la ../build/ios

      - name: Archive (automatic cloud signing)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project build/ios/MysteryRoom.xcodeproj -scheme MysteryRoom -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ios/MysteryRoom.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Development" 2>&1 | tail -60
          # Godot's Release config asks for "Apple Distribution" with Automatic style, which Xcode rejects as
          # "conflicting provisioning settings"; the archive is development-signed and -exportArchive below
          # re-signs it with the cloud-managed distribution certificate.
          test -d build/ios/MysteryRoom.xcarchive

      - name: Export IPA (and upload to TestFlight)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DEST=export
          if [ "${{ inputs.upload_to_testflight }}" = "true" ]; then DEST=upload; fi
          cat > build/ios/ExportOptions.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOT
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/ios/MysteryRoom.xcarchive -exportPath build/ios/export \
            -exportOptionsPlist build/ios/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -60
          ls -la build/ios/export || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mystery-room-ios
          path: build/ios/export/
          retention-days: 7
