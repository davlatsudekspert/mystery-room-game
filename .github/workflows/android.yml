# MYSTERY ROOM — Android build (debug APK / release AAB) and optional Google Play internal-testing upload.
# Manual trigger only: private-repo Actions minutes are metered, so runs happen only when the owner starts them.
# Required secrets for release/upload (never commit keys):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON (only for upload)
name: Android build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug (APK) or release (AAB)"
        type: choice
        options: [debug, release]
        default: debug
      upload_to_play:
        description: "Upload the release AAB to Google Play internal testing"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.7.2"
  PACKAGE_NAME: com.mysteryroom.forgotteninstitute

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot + templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Install Godot and Android templates
        run: |
          mkdir -p ~/godot
          if [ ! -x ~/godot/godot ]; then
            curl -sSL -o /tmp/g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/g.zip -d ~/godot && mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/android_release.apk" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -j /tmp/t.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt -d "$T"
          fi
          sudo ln -sf ~/godot/godot /usr/local/bin/godot

      - name: Import project and run tests
        run: |
          cd game
          godot --headless --import || true
          godot --headless res://tests/run_all.tscn

      - name: Configure Godot editor settings (SDK + signing)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ~/release.keystore; fi

      - name: Export debug APK
        if: inputs.build_type == 'debug'
        run: |
          mkdir -p build/android
          cd game && godot --headless --export-debug "Android" ../build/android/mystery-room-debug.apk
          ls -la ../build/android

      - name: Export release AAB (Gradle build)
        if: inputs.build_type == 'release'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -s ~/release.keystore || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          mkdir -p build/android
          cd game
          godot --headless --install-android-build-template || true
          godot --headless --export-release "Android AAB" ../build/android/mystery-room-release.aab
          ls -la ../build/android

      - uses: actions/upload-artifact@v4
        with:
          name: mystery-room-android-${{ inputs.build_type }}
          path: build/android/*
          retention-days: 14

      - name: Upload to Google Play (internal testing, draft)
        if: inputs.build_type == 'release' && inputs.upload_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/android/mystery-room-release.aab
          track: internal
          status: draft
